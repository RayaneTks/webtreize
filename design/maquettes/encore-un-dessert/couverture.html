<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="format" content="couverture">
<meta name="viewport" content="width=1600">
<title>Encore 1 Dessert — couverture</title>
<style>
  /* Couleurs de src/index.css : chocolat #241309, caramel #C05621, crème #FDF8F2 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; background: #C05621; }
  body { position: relative; }


  .scene { position: absolute; inset: 0; perspective: 2400px; }

  .tel { position: absolute; width: 500px; aspect-ratio: 390 / 844; padding: 12px; border-radius: 72px;
    background: #120904; box-shadow: 0 0 0 1.5px #4a3326 inset, 0 60px 110px rgba(60, 20, 4, .45), 0 18px 36px rgba(60, 20, 4, .3); }
  .tel img { display: block; width: 100%; height: 100%; border-radius: 60px; object-fit: cover; }
  .tel::after { content: ''; position: absolute; top: 25px; left: 50%; width: 132px; height: 38px; margin-left: -66px;
    border-radius: 20px; background: #120904; }

  .centre { left: 550px; top: 150px; z-index: 3; }
  .gauche { left: 104px; top: 262px; z-index: 2; width: 450px; padding: 11px; border-radius: 65px;
    transform: rotateY(12deg) rotateZ(-4deg); transform-origin: 100% 50%; }
  .droite { left: 1046px; top: 262px; z-index: 2; width: 450px; padding: 11px; border-radius: 65px;
    transform: rotateY(-12deg) rotateZ(4deg); transform-origin: 0% 50%; }
  .gauche img, .droite img { border-radius: 54px; }
  .gauche::after, .droite::after { top: 23px; width: 118px; height: 34px; margin-left: -59px; }
</style>
</head>
<body>
  <div class="scene">
    <div class="tel gauche"><img src="assets/production.jpg" alt=""></div>
    <div class="tel droite"><img src="assets/compta.jpg" alt=""></div>
    <div class="tel centre"><img src="assets/fiche-dessert.jpg" alt=""></div>
  </div>
</body>
</html>
