<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="format" content="couverture">
<title>Magda Mania — couverture</title>
<style>
  /* Aplat rose néon du logo (magda-600), nuit de l'enseigne pour les appareils */
  :root { --magda-600: #f50054; --magda-700: #cc0046; --night-950: #0e1430; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; }
  body { background: var(--magda-600); position: relative; }

  .logo { position: absolute; left: 96px; top: 80px; width: 168px; height: 168px; border-radius: 50%; box-shadow: 0 18px 40px -16px rgb(77 0 25 / .55); }

  .scene { position: absolute; inset: 0; perspective: 3200px; }
  .plan { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(7deg) rotateY(-11deg) rotateZ(2deg); transform-origin: 60% 55%; }

  .tablette { position: absolute; left: 140px; top: 296px; width: 1180px; height: 758px; padding: 20px; border-radius: 40px; background: #0b0f22; box-shadow: 0 0 0 2px #262d4d inset, 0 60px 120px -40px rgb(60 0 20 / .7), 0 24px 48px -24px rgb(60 0 20 / .5); }
  .tablette img { display: block; width: 1140px; height: 718px; object-fit: cover; object-position: top left; border-radius: 22px; }

  .telephone { position: absolute; left: 1150px; top: 352px; width: 352px; height: 740px; padding: 12px; border-radius: 56px; background: #0b0f22; box-shadow: 0 0 0 2px #262d4d inset, 0 60px 110px -30px rgb(60 0 20 / .75), 0 20px 40px -20px rgb(60 0 20 / .5); transform: translateZ(60px); }
  .telephone img { display: block; width: 328px; height: 716px; object-fit: cover; object-position: top; border-radius: 45px; }
</style>
</head>
<body>
  <img class="logo" src="assets/logo.webp" alt="">
  <div class="scene">
    <div class="plan">
      <div class="tablette"><img src="assets/ecran-cuisine.jpg" alt=""></div>
      <div class="telephone"><img src="assets/ecran-carte.jpg" alt=""></div>
    </div>
  </div>
</body>
</html>
