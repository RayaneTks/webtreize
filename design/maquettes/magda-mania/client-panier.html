<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="format" content="telephone">
<title>Magda Mania — composer un menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --magda-50: #fff0f5; --magda-100: #ffe1ec; --magda-500: #ff0a60; --magda-600: #f50054; --magda-700: #cc0046;
    --night-100: #e8ecf6; --night-200: #ccd5eb; --night-300: #a2b3da; --night-400: #6f88c5; --night-500: #4c66ae; --night-600: #3a5094; --night-700: #314279; --night-900: #1d2749; --night-950: #0e1430;
    --cream-50: #ffffff; --cream-100: #fbfaf9; --cream-200: #f2f1ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { position: relative; background: #6f7182; color: var(--night-950); font: 15px/1.45 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .d { font-family: 'Fredoka', sans-serif; letter-spacing: -.015em; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* La carte, assombrie derrière la fiche (voile night-950 à 60 %) */
  .statut { height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 4px 28px 0 34px; font: 600 16px/1 'Plus Jakarta Sans'; color: #fff; }

  .fiche { position: absolute; top: 58px; left: 0; right: 0; bottom: 0; background: var(--cream-50); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; overflow: hidden; }
  .poignee { width: 44px; height: 6px; border-radius: 3px; background: var(--night-200); margin: 12px auto 0; flex: none; }
  .tete { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 14px 20px; }
  .tete h1 { font-size: 23px; font-weight: 600; line-height: 1.15; display: flex; align-items: center; gap: 8px; }
  .tete p { margin-top: 3px; font-size: 14.5px; color: var(--night-500); }
  .fermer { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--night-400); flex: none; }
  .halal { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(5,150,105,.4); background: #ecfdf5; color: #065f46; font: 600 10px/1 'Plus Jakarta Sans'; display: inline-grid; place-items: center; }

  .corps { padding: 0 20px; flex: 1; overflow: hidden; }
  .visuel { height: 136px; border-radius: 16px; background: var(--cream-200); display: grid; place-items: center; }
  .visuel img { height: 128px; width: auto; }

  .groupe { margin-top: 24px; }
  .groupe .t { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .groupe h2 { font-size: 18px; font-weight: 600; }
  .oblig { font-size: 12px; font-weight: 700; color: var(--magda-700); background: var(--magda-100); border-radius: 999px; padding: 4px 10px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { min-height: 54px; border: 2px solid var(--night-100); border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; }
  .opt .rad { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--night-300); flex: none; display: grid; place-items: center; }
  .opt b { display: block; font-size: 15px; font-weight: 600; color: var(--night-900); line-height: 1.25; }
  .opt small { display: block; font-size: 13px; color: var(--night-500); line-height: 1.3; }
  .opt.sel { border-color: var(--magda-500); background: var(--magda-50); }
  .opt.sel .rad { background: var(--magda-600); border-color: var(--magda-600); color: #fff; }

  .pied { flex: none; border-top: 1px solid var(--night-100); padding: 12px 16px 28px; display: flex; gap: 12px; background: var(--cream-50); }
  .pas { display: flex; align-items: center; gap: 2px; border: 1px solid var(--night-200); border-radius: 16px; padding: 4px; }
  .pas span { width: 40px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--night-700); }
  .pas span.off { color: var(--night-200); }
  .pas b { width: 24px; text-align: center; font-size: 18px; font-weight: 700; }
  .ajouter { flex: 1; height: 54px; border-radius: 16px; background: var(--magda-600); color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; box-shadow: 0 10px 24px -12px rgb(245 0 84 / .6); }
</style>
</head>
<body>
  <div class="statut">
    <span class="num">13:25</span>
    <svg width="66" height="12" viewBox="0 0 66 12" fill="#fff" aria-hidden="true">
      <rect x="0" y="8" width="3" height="4" rx=".6"/><rect x="5" y="6" width="3" height="6" rx=".6"/><rect x="10" y="3.5" width="3" height="8.5" rx=".6"/><rect x="15" y="1" width="3" height="11" rx=".6"/>
      <rect x="38.5" y=".5" width="23" height="11" rx="2.6" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="40.5" y="2.5" width="15" height="7" rx="1.2"/><rect x="63" y="4" width="1.6" height="4" rx=".6" fill-opacity=".5"/>
    </svg>
  </div>

  <section class="fiche">
    <div class="poignee"></div>
    <div class="tete">
      <div>
        <h1 class="d">Menu Paninis <span class="halal" lang="ar">حلال</span></h1>
        <p>1 panini + frites + boisson</p>
      </div>
      <span class="fermer"><svg class="i" width="22" height="22" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
    </div>

    <div class="corps">
      <div class="visuel"><img src="assets/menu-panini.webp" alt=""></div>

      <section class="groupe">
        <div class="t"><h2 class="d">Votre panini</h2><span class="oblig">Obligatoire</span></div>
        <div class="options">
          <div class="opt"><span class="rad"></span><span><b>Américain</b><small>Bœuf haché, tomate, mozzarella</small></span></div>
          <div class="opt"><span class="rad"></span><span><b>Pesto</b><small>Tomate, mozzarella, pesto</small></span></div>
          <div class="opt sel"><span class="rad"><svg class="i" width="14" height="14" viewBox="0 0 24 24" stroke-width="3.5"><path d="M20 6 9 17l-5-5"/></svg></span><span><b>Raclette</b><small>Jambon, raclette</small></span></div>
          <div class="opt"><span class="rad"></span><span><b>Poulet</b><small>Oignons caramélisés, fromage</small></span></div>
        </div>
      </section>

      <section class="groupe">
        <div class="t"><h2 class="d">Votre boisson</h2><span class="oblig">Obligatoire</span></div>
        <div class="options">
          <div class="opt"><span class="rad"></span><span><b>Coca</b></span></div>
          <div class="opt"><span class="rad"></span><span><b>Coca zéro</b></span></div>
        </div>
      </section>
    </div>

    <div class="pied">
      <div class="pas">
        <span class="off"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></span>
        <b class="d num">1</b>
        <span><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
      </div>
      <div class="ajouter"><svg class="i" width="20" height="20" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span class="d">Ajouter · <span class="num">8,90&nbsp;€</span></span></div>
    </div>
  </section>
</body>
</html>
