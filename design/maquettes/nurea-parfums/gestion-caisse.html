<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="format" content="telephone">
<title>Nuréa Gestion — vendre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #F2F2F7; --surface: #FFFFFF; --surface-muted: #EFEAE4; --border: rgba(0,0,0,.08); --border-strong: rgba(0,0,0,.14);
    --text: #111114; --muted: #5F5862; --subtle: #726B75;
    --accent: #7B0B1D; --accent-bg: rgba(123,11,29,.08);
    --r-sm: 8px; --r-md: 12px; --r-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(26,18,21,.04), 0 1px 3px rgba(139,58,58,.03);
    --shadow-md: 0 4px 12px rgba(26,18,21,.06), 0 2px 4px rgba(139,58,58,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; background: var(--bg); color: var(--text);
    font: 400 15px/1.4 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; position: relative; font-feature-settings: "cv11", "ss01"; }
  .tnum { font-variant-numeric: tabular-nums; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .etat { height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 6px 28px 0 34px; font: 600 16px/1 'Inter', sans-serif; background: rgba(242,242,247,.92); }
  .etat .ic { display: flex; gap: 6px; align-items: center; }
  .barres { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
  .barres i { width: 3px; background: var(--text); border-radius: 1px; }
  .pile { width: 24px; height: 12px; border: 1px solid rgba(0,0,0,.4); border-radius: 3px; padding: 1.5px; }
  .pile i { display: block; height: 100%; width: 74%; background: var(--text); border-radius: 1px; }

  header { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(242,242,247,.92); border-bottom: 1px solid var(--border); }
  .segment { flex: 1; height: 40px; padding: 3px; border-radius: var(--r-md); background: var(--surface-muted); display: grid; grid-template-columns: 1fr 1fr; font-size: 15px; font-weight: 600; color: var(--muted); }
  .segment span { display: flex; align-items: center; justify-content: center; border-radius: 9px; }
  .segment .ici { background: var(--surface); color: var(--text); box-shadow: var(--shadow-md); }
  .plus { width: 44px; height: 44px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; color: var(--muted); }

  .page { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
  .lib { font-size: 13px; font-weight: 600; color: var(--muted); padding: 0 4px 6px; }

  .champ { height: 48px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border-strong); display: flex; align-items: center; padding: 0 14px; font-size: 16px; font-weight: 500; }
  .aide { font-size: 13px; color: var(--muted); padding: 6px 4px 0; }

  .ligne { padding: 12px; }
  .ligne .haut { display: flex; gap: 12px; }
  .ligne img { width: 48px; height: 64px; border-radius: var(--r-sm); object-fit: cover; }
  .ligne .nom { flex: 1; }
  .ligne .nom b { display: block; font-size: 16px; font-weight: 600; margin-top: 2px; }
  .ligne .nom span { font-size: 13px; color: var(--muted); }
  .ligne .prix { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .ligne .bas { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .puces { display: flex; gap: 8px; }
  .puce { min-width: 52px; height: 40px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: var(--surface); }
  .puce.ici { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .stepper { display: flex; align-items: center; height: 40px; border-radius: var(--r-md); background: var(--surface-muted); }
  .stepper span { width: 40px; display: flex; justify-content: center; color: var(--text); }
  .stepper span svg { width: 18px; height: 18px; }
  .stepper b { width: 24px; text-align: center; font-size: 16px; font-weight: 600; }

  .bouton-champ { height: 48px; border-radius: var(--r-md); border: 1px solid var(--border-strong); background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--subtle); font-size: 16px; }
  .rangee { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-size: 15px; font-weight: 500; }
  .rangee p { flex: 1; }
  .rangee .gris { color: var(--muted); }
  .chev { color: var(--subtle); width: 16px; height: 16px; }

  .paiement { padding: 16px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; }
  .total span { font-size: 13px; font-weight: 600; color: var(--muted); }
  .total b { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .marge { text-align: right; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .recu { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .recu .champ { font-weight: 600; margin-bottom: 10px; }
  .recu .lib { padding: 0 0 6px; }
  .poches { margin-top: 0; }
  .ligne-recu { display: flex; gap: 8px; }
  .ligne-recu .champ { width: 112px; margin: 0; height: 40px; }
  .serre .puce { padding: 0 10px; min-width: 0; }

  .fixe { position: absolute; left: 0; right: 0; bottom: 88px; padding: 10px 16px 12px; background: #F2F2F7; border-top: 1px solid var(--border); }
  .fixe p { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .cta { height: 52px; border-radius: var(--r-lg); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; box-shadow: var(--shadow-md); }

  nav { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #F9F9FB; border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px 0; }
  nav span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--muted); }
  nav span > svg, nav span > i { height: 28px; }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  nav .ici { color: var(--accent); font-weight: 700; }
  nav .vendre i { width: 44px; border-radius: 8px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
  nav .vendre svg { width: 20px; height: 20px; stroke-width: 2.4; }
</style>
</head>
<body>
  <div class="etat"><span>18:42</span><span class="ic"><span class="barres"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="pile"><i></i></span></span></div>

  <header>
    <div class="segment"><span class="ici">Vente</span><span>Commande</span></div>
    <span class="plus"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></span>
  </header>

  <main class="page">
    <section>
      <p class="lib">Client</p>
      <div class="champ">Nadia B.</div>
    </section>

    <section>
      <p class="lib">Articles</p>
      <div class="card ligne">
        <div class="haut">
          <img src="assets/armani-stronger-with-you.webp" alt="">
          <div class="nom"><b>Stronger With You</b><span>Giorgio Armani</span></div>
          <span class="prix tnum">85&nbsp;€</span>
        </div>
        <div class="bas">
          <div class="puces tnum"><span class="puce">10</span><span class="puce ici">50&#8239;ml</span><span class="puce">80</span></div>
          <div class="stepper"><span><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></span><b class="tnum">1</b><span><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span></div>
        </div>
      </div>
    </section>



    <section class="card paiement">
      <div class="total"><span>Total</span><b class="tnum">85&nbsp;€</b></div>
      <p class="marge tnum">Marge avant dépenses 30,85&nbsp;€</p>
      <div class="recu">
        <p class="lib">Reçu maintenant</p>
        <div class="ligne-recu"><div class="champ tnum">85,00&nbsp;€</div><div class="puces serre"><span class="puce ici">Tout</span><span class="puce">La moitié</span><span class="puce">Rien</span></div></div>
        <p class="lib" style="margin-top:14px">Poche</p>
        <div class="puces poches"><span class="puce ici">Espèces</span><span class="puce">Banque</span></div>
      </div>
    </section>
  </main>

  <div class="fixe">
    <p>Espèces · lot Commande de septembre</p>
    <div class="cta tnum">Encaisser 85&nbsp;€</div>
  </div>

  <nav>
    <span><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Accueil</span>
    <span><svg viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>Commandes</span>
    <span class="vendre ici"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg></i>Vendre</span>
    <span><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clients</span>
    <span><svg viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"/><path d="m7.5 4.27 9 5.15"/></svg>Catalogue</span>
  </nav>
</body>
</html>
