<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="format" content="telephone">
<title>Conciergerie Nuréa — accueil, téléphone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  :root {
    --white: #FFFFFF;
    --ink: #11313E;
    --ink-soft: #587685;
    --azur: #1E92B8;
    --azur-deep: #0C617C;
    --sky: #7BC4DD;
    --line: #E4EBEF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body {
    position: relative; background: var(--ink); color: var(--white);
    font-family: 'Geist', system-ui, sans-serif; font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .tabular { font-variant-numeric: tabular-nums; }

  .photo { position: absolute; inset: 0 0 84px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 12% 50%; filter: saturate(.92) contrast(1.04); }
  .voile { position: absolute; inset: 0 0 84px;
    background:
      linear-gradient(180deg, rgba(17,49,62,1) 0%, rgba(17,49,62,.9) 12%, rgba(17,49,62,.55) 55%, rgba(17,49,62,.92) 88%, rgba(17,49,62,1) 100%),
      linear-gradient(90deg, rgba(17,49,62,.5), rgba(17,49,62,.1));
  }

  .etat { position: relative; height: 47px; padding: 0 26px 0 32px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; }
  .etat .icones { display: flex; gap: 6px; align-items: center; }
  .etat svg { display: block; }

  header { position: relative; height: 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .mark { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.1); display: grid; place-items: center; }
  .logo .nom { display: flex; flex-direction: column; line-height: 1; }
  .logo .nom b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .logo .nom span { margin-top: 4px; font-size: 9px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: rgba(123,196,221,.85); }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 500; }
  .pill i { font-size: 18px; }
  header .pill { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); }

  main { position: relative; padding: 36px 20px 0; }
  .surtitre { font-size: 14px; font-weight: 500; color: var(--sky); }
  h1 { margin-top: 12px; font-size: 36px; line-height: 1.05; text-wrap: balance; font-weight: 600; letter-spacing: -.035em; }
  .sous { margin-top: 10px; font-size: 28px; line-height: 1.1; font-weight: 600; letter-spacing: -.03em; color: var(--sky); }
  .simuler { margin-top: 24px; display: inline-flex; align-items: center; gap: 8px; height: 44px; font-size: 16px; font-weight: 600; }
  .simuler i { font-size: 18px; color: var(--sky); }

  dl { position: absolute; left: 20px; right: 20px; bottom: 108px; border-radius: 16px; border: 1px solid rgba(255,255,255,.12); background: rgba(17,49,62,.6); }
  dl div { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 18px; }
  dl div + div { border-top: 1px solid rgba(255,255,255,.1); }
  dt { font-size: 15px; color: rgba(123,196,221,.9); }
  dd { font-size: 16px; font-weight: 600; }

  .barre { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: var(--white); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px 26px; }
  .barre a { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .barre i { font-size: 18px; }
  .barre .appel { border: 1px solid var(--line); color: var(--ink); }
  .barre .appel i { color: var(--ink-soft); }
  .barre .wa { background: var(--azur); color: var(--white); }
</style>
</head>
<body>
  <div class="photo"><img src="assets/calanques-haut.jpg" alt=""></div>
  <div class="voile"></div>

  <div class="etat">
    <span class="tabular">10:42</span>
    <span class="icones">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7.5" width="3" height="3.5" rx=".6"/><rect x="4.6" y="5" width="3" height="6" rx=".6"/><rect x="9.2" y="2.5" width="3" height="8.5" rx=".6"/><rect x="13.8" y="0" width="3" height="11" rx=".6"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1.2 3.9a9 9 0 0 1 12.6 0"/><path d="M3.6 6.3a5.6 5.6 0 0 1 7.8 0"/><circle cx="7.5" cy="9" r=".9" fill="#fff" stroke="none"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="#fff"/><rect x="22.6" y="4" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg>
    </span>
  </div>

  <header>
    <div class="logo">
      <span class="mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M2 14c1.5 0 1.5-2 3-2s1.5 2 3 2 1.5-2 3-2 1.5 2 3 2 1.5-2 3-2 1.5 2 3 2" stroke="#7BC4DD" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.5" r="2.25" fill="#1E92B8"/></svg></span>
      <span class="nom"><b>Nuréa</b><span>Conciergerie</span></span>
    </div>
    <a class="pill"><i class="ph-fill ph-whatsapp-logo"></i>Nous écrire</a>
  </header>

  <main>
    <p class="surtitre">Conciergerie Airbnb à Marseille</p>
    <h1>Votre appartement génère des revenus.</h1>
    <p class="sous">Vous ne gérez rien.</p>
    <a class="simuler">Simuler mes revenus <i class="ph ph-arrow-right"></i></a>
  </main>

  <dl>
    <div><dt>Commission</dt><dd class="tabular">25&#8239;% sur l’encaissé</dd></div>
    <div><dt>Engagement</dt><dd>Aucun</dd></div>
    <div><dt>Cautions</dt><dd>Swikly, au prorata</dd></div>
  </dl>

  <div class="barre">
    <a class="appel"><i class="ph-fill ph-phone"></i>Appeler</a>
    <a class="wa"><i class="ph-fill ph-whatsapp-logo"></i>WhatsApp</a>
  </div>
</body>
</html>
